; PlatformIO project configuration -- DFRobot FireBeetle 2 ESP32-C6 (DFR1075)
;
; The official platformio/platform-espressif32 Arduino framework is still on core 2.0.17
; (no ESP32-C6 support), so the pioarduino community fork is used instead. It ships the
; dfrobot_firebeetle2_esp32c6 board definition, so no custom board JSON is needed.
;
; src_dir = . makes PlatformIO compile this folder directly. The Arduino IDE can still
; open epd7in3e.ino as before (rename the folder to `epd7in3e` for the IDE, see README).

[platformio]
src_dir = .
include_dir = .
default_envs = firebeetle2_esp32c6

[env:firebeetle2_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = dfrobot_firebeetle2_esp32c6

; min_spiffs: app0/app1 are 0x1E0000 (1,966,080) each + 128 KB SPIFFS, keeping both OTA slots.
; default.csv only gives the app 1,310,720 bytes, which Arduino core 3.3.11 + these libraries exceed.
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

; Compile only the sources in this folder; exclude the portal HTML tooling
build_src_filter =
  +<*.c>
  +<*.cpp>
  +<*.ino>
  -<AP_webpage_src/>

build_flags =
  -DCORE_DEBUG_LEVEL=3

; The ST25DV library.properties declares architectures=stm32,avr,samd,arc32 (no esp32),
; so PlatformIO's default soft compatibility check would skip it as incompatible.
lib_compat_mode = off
lib_deps =
  bblanchon/ArduinoJson@^7.4.3
  esp32async/AsyncTCP@^3.5.0
  esp32async/ESPAsyncWebServer@^3.12.0
  arduino-libraries/NTPClient@^3.2.1
  stm32duino/STM32duino ST25DV@^2.2.0
  ricmoo/QRCode@^0.0.1
